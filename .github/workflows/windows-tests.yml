name: Windows regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run regression tests
        run: python -m unittest -v
      - name: Check Python syntax
        run: python -m compileall -q app.py resource src tests

  package:
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install build tool
        run: python -m pip install -r requirements-build.txt
      - name: Build Windows bundle
        run: .\scripts\build_windows.ps1
      - name: Smoke test packaged executable
        run: .\scripts\smoke_packaged.ps1
      - name: Create unsigned validation archive
        run: Compress-Archive -Path .\dist\AnalisadorSegurancaPessoal -DestinationPath .\dist\AnalisadorSegurancaPessoal-win-x64-unsigned.zip -CompressionLevel Optimal -Force
      - name: Create SHA-256 manifest
        run: |
          $archive = ".\dist\AnalisadorSegurancaPessoal-win-x64-unsigned.zip"
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $archive -Leaf)" | Set-Content "$archive.sha256" -Encoding ascii
      - name: Upload validation artifact
        uses: actions/upload-artifact@v7
        with:
          name: AnalisadorSegurancaPessoal-win-x64-unsigned
          path: |
            dist/AnalisadorSegurancaPessoal-win-x64-unsigned.zip
            dist/AnalisadorSegurancaPessoal-win-x64-unsigned.zip.sha256
          if-no-files-found: error
          retention-days: 7
